[experiment]
name = example

[model]
d_model = 1600
num_heads = 25
d_ff = 6400
vocab_size = 50257
context_length = 1024
num_layers = 48
theta = 10000
eps = 1e-5

[optimizer]
lr = 6e-4
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.01

[lr_scheduler]
lr_max = 6e-4
lr_min = 6e-5
warmup_iters = 1000
cosine_iters = 10000

[training]
batch_size = 32
max_iters = 10000
grad_clip_max_norm = 1.0
checkpoint_interval = 1000
eval_interval = 100
eval_iters = 10
device = cuda