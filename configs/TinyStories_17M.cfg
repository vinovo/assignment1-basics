[experiment]
name = TinyStories_17M

[model]
vocab_size = 10000
context_length = 256
d_model = 512
num_layers = 4
num_heads = 16
d_ff = 1344
theta = 10000

[optimizer]
lr = 1e-3
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.1

[lr_scheduler]
lr_max = 1e-3
lr_min = 1e-4
warmup_iters = 100
cosine_iters = 40000

[training]
batch_size = 32
max_iters = 40000